<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 380px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .signup a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome to Setu</h1>
        <p class="subtitle">Login to your account</p>

        <form onsubmit="login(event)">

            <div class="input-box">
                <label>Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-box">
                <label>Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <a href="#" class="forgot">Forgot Password?</a>

            <button type="submit" class="login-btn" onclick="login(event)">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>


    <script>
        function login(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            // Store login information
            localStorage.setItem("email", email);
            localStorage.setItem("password", password);

            document.getElementById("message").innerHTML =
                "Login information saved successfully!";

            document.getElementById("message").style.color = "green";
        }
        onclick = "login(event)"
        function login(event) {
    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    // Store login information
    localStorage.setItem("email", email);
    localStorage.setItem("password", password);

    // Redirect to home page
    window.location.href = "home.html";
}
    </script>

</body>
</html>
